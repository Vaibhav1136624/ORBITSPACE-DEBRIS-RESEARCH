[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "space-debris-prioritiser"
version = "0.1.0"
description = "Reproducible encounter-level research for space-debris alert prioritisation"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]
sequence = ["torch==2.14.0"]

[project.scripts]
debris-research = "debris_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
